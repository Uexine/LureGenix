services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./db:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"

  auth_service:
    build: ./services/auth_service
    depends_on:
      - postgres
    environment:
      - DB_HOST=postgres
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
    command: uvicorn main:app --host 0.0.0.0 --port 8000

  honeytoken_service:
    build: ./services/honeytoken_service
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./tokens:/tokens  # для persistence
    environment:
      - GROK_API_KEY=${GROK_API_KEY}
    command: uvicorn main:app --host 0.0.0.0 --port 8000

  event_service:
    build: ./services/event_service
    depends_on:
      - postgres
    environment:
      - DB_HOST=postgres
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
    command: uvicorn main:app --host 0.0.0.0 --port 8000

  gateway:
    build: ./gateway
    depends_on:
      - auth_service
      - honeytoken_service
      - event_service
    ports:
      - "8000:8000"
    environment:
      - JWT_SECRET=${JWT_SECRET}
    command: uvicorn main:app --host 0.0.0.0 --port 8000

  agent:
    build: ./agent
    depends_on:
      - gateway

  nginx:
    image: nginx:alpine3.20
    ports:
      - "8080:80"
    volumes:
      - ./frontend:/usr/share/nginx/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - gateway