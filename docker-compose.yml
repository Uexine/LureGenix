services:
  postgres:
    image: postgres:18  # Обновил до актуальной
    environment:
      POSTGRES_DB: ${DB_NAME:-luregenix}
      POSTGRES_USER: ${DB_USER:-admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-admin}
    volumes:
      - ./db:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"

  auth_service:
    build: ./services/auth_service
    depends_on:
      - postgres
    environment:
      - JWT_SECRET=${JWT_SECRET}

  honeytoken_service:
    build: ./services/honeytoken_service
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./tokens:/tokens  # Добавил volume для persistence токенов

  event_service:
    build: ./services/event_service
    depends_on:
      - postgres

  gateway:
    build: ./gateway
    depends_on:
      - auth_service
      - honeytoken_service
      - event_service
    ports:
      - "8000:8000"
    environment:
      - JWT_SECRET=${JWT_SECRET}

  agent:
    build: ./agent
    depends_on:
      - gateway

  nginx:
    image: nginx:alpine3.19  # Обновил
    ports:
      - "8080:80"
    volumes:
      - ./frontend:/usr/share/nginx/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - gateway