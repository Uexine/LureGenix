services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./db:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - luregenix

  auth_service:
    build: ./services/auth_service
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DB_HOST=postgres
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - ADMIN_SECRET=${ADMIN_SECRET:-}
      - BOOTSTRAP_ADMIN_USERNAME=${BOOTSTRAP_ADMIN_USERNAME:-admin}
      - BOOTSTRAP_ADMIN_PASSWORD=${BOOTSTRAP_ADMIN_PASSWORD:-}
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    networks:
      - luregenix

  honeytoken_service:
    build: ./services/honeytoken_service
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://ollama:11434}
      - GENERATION_MODE=${GENERATION_MODE:-template}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5:3b}
      - LLM_TIMEOUT_SECONDS=${LLM_TIMEOUT_SECONDS:-180}
      - DB_HOST=postgres
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    networks:
      - luregenix

  ollama:
    profiles: ["llm"]
    image: ollama/ollama:latest
    environment:
      - OLLAMA_NO_CLOUD=1
    volumes:
      - ollama_models:/root/.ollama
    restart: unless-stopped
    networks:
      - luregenix

  event_service:
    build: ./services/event_service
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DB_HOST=postgres
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    networks:
      - luregenix

  discovery_service:
    build: ./services/discovery_service
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DB_HOST=postgres
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    networks:
      - luregenix

  gateway:
    build: ./gateway
    depends_on:
      auth_service:
        condition: service_started
      honeytoken_service:
        condition: service_started
      event_service:
        condition: service_started
      discovery_service:
        condition: service_started
    ports:
      - "8000:8000"
    environment:
      - JWT_SECRET=${JWT_SECRET}
      - ADMIN_SECRET=${ADMIN_SECRET:-}
      - AGENT_SECRET=${AGENT_SECRET:-}
      - LLM_TIMEOUT_SECONDS=${LLM_TIMEOUT_SECONDS:-180}
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')\" || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - luregenix

  nginx:
    image: nginx:alpine3.20
    ports:
      - "8080:80"
    volumes:
      - ./frontend:/usr/share/nginx/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      gateway:
        condition: service_healthy
    networks:
      - luregenix

volumes:
  ollama_models:

networks:
  luregenix:
    driver: bridge
