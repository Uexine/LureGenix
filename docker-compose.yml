services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./db:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - luregenix

  auth_service:
    build: ./services/auth_service
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DB_HOST=postgres
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    networks:
      - luregenix

  honeytoken_service:
    build: ./services/honeytoken_service
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./tokens:/tokens
    environment:
      - GROK_API_KEY=${GROK_API_KEY}
      - DB_HOST=postgres
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    networks:
      - luregenix

  event_service:
    build: ./services/event_service
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DB_HOST=postgres
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    networks:
      - luregenix

  gateway:
    build: ./gateway
    depends_on:
      auth_service:
        condition: service_started
      honeytoken_service:
        condition: service_started
      event_service:
        condition: service_started
    ports:
      - "8000:8000"
    environment:
      - JWT_SECRET=${JWT_SECRET}
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')\" || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - luregenix

  agent:
    build: ./agent
    depends_on:
      - gateway
    networks:
      - luregenix

  nginx:
    image: nginx:alpine3.20
    ports:
      - "8080:80"
    volumes:
      - ./frontend:/usr/share/nginx/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      gateway:
        condition: service_healthy
    networks:
      - luregenix

networks:
  luregenix:
    driver: bridge