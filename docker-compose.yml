name: luregenix

x-python-service: &python-service
  restart: unless-stopped
  read_only: true
  tmpfs: ["/tmp:size=64m,mode=1777"]
  user: "10001:10001"
  cap_drop: ["ALL"]
  security_opt: ["no-new-privileges:true"]
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=3)"]
    interval: 10s
    timeout: 5s
    retries: 10
    start_period: 20s

x-database: &database
  DB_HOST: postgres
  DB_NAME: ${DB_NAME:?Run python3 tools/setup_env.py first}
  DB_USER: ${APP_DB_USER:-luregenix_app}
  DB_PASSWORD: ${APP_DB_PASSWORD:?APP_DB_PASSWORD is required}

x-backend: &backend
  <<: *python-service
  depends_on:
    database_init:
      condition: service_completed_successfully

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10

  database_init:
    image: postgres:16
    restart: "no"
    read_only: true
    user: "999:999"
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      APP_DB_USER: ${APP_DB_USER:-luregenix_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
    entrypoint: ["/bin/sh", "/migrations/migrate.sh"]
    volumes:
      - ./db:/migrations:ro

  auth_service:
    <<: *backend
    build:
      context: .
      dockerfile: services/Dockerfile
      args: {SERVICE: auth_service}
    environment:
      <<: *database
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      ADMIN_SECRET: ${ADMIN_SECRET:-}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-admin}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}

  honeytoken_service:
    <<: *backend
    build:
      context: .
      dockerfile: services/Dockerfile
      args: {SERVICE: honeytoken_service}
    environment:
      <<: *database
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      GENERATION_MODE: ${GENERATION_MODE:-template}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-180}

  event_service:
    <<: *backend
    build:
      context: .
      dockerfile: services/Dockerfile
      args: {SERVICE: event_service}
    environment:
      <<: *database
      EVENT_RETENTION_DAYS: ${EVENT_RETENTION_DAYS:-30}

  discovery_service:
    <<: *backend
    build:
      context: .
      dockerfile: services/Dockerfile
      args: {SERVICE: discovery_service}
    environment:
      <<: *database
      DISCOVERY_ALLOWED_CIDRS: ${DISCOVERY_ALLOWED_CIDRS:-}

  gateway:
    <<: *python-service
    build: ./gateway
    depends_on:
      auth_service: {condition: service_healthy}
      honeytoken_service: {condition: service_healthy}
      event_service: {condition: service_healthy}
      discovery_service: {condition: service_healthy}
    environment:
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_SECRET: ${ADMIN_SECRET:-}
      AGENT_SECRET: ${AGENT_SECRET:?AGENT_SECRET is required}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-180}

  nginx:
    image: nginx:stable-alpine
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:8080:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx:/etc/nginx/luregenix:ro
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    depends_on:
      gateway: {condition: service_healthy}

  ollama:
    profiles: ["llm"]
    image: ollama/ollama:latest
    environment:
      OLLAMA_NO_CLOUD: "1"
    volumes:
      - ollama_models:/root/.ollama
    restart: unless-stopped

volumes:
  postgres_data:
    name: ${POSTGRES_DATA_VOLUME:-luregenix_postgres_data}
  ollama_models:
