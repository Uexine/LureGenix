<!DOCTYPE html>
<html>

<head>

<title>LureGenix Admin</title>

<style>

body{
background:#0f172a;
font-family:system-ui;
display:flex;
align-items:center;
justify-content:center;
height:100vh;
margin:0;
color:white;
}

.login-card{
background:#1e293b;
padding:40px;
border-radius:12px;
width:320px;
box-shadow:0 10px 30px rgba(0,0,0,0.4);
}

h2{
margin-top:0;
text-align:center;
}

input{
width:100%;
padding:10px;
margin:10px 0;
border-radius:6px;
border:none;
}

button{
width:100%;
padding:10px;
background:#3b82f6;
border:none;
color:white;
border-radius:6px;
cursor:pointer;
}

button:hover{
background:#2563eb;
}

#error{
color:red;
margin-top:10px;
text-align:center;
}

</style>

</head>

<body>

<div class="login-card">

<h2>LureGenix Admin</h2>

<input id="user" placeholder="Username">

<input id="pass" type="password" placeholder="Password">

<button onclick="login()">Login</button>

<div id="error"></div>

</div>

<script src="/js/app.js"></script>

</body>

</html>
