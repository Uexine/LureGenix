server {
    listen 8080;
    server_name _;
    
    root /home/master/LureGenix/frontend;
    index index.html;
    
    # Логи
    access_log /home/master/LureGenix/logs/access.log;
    error_log /home/master/LureGenix/logs/error.log;
    
    location / {
        try_files $uri $uri/ /index.html;
    }
    
    # Для статики
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }
    
    # Для проверки здоровья
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
    
    # Для отладки
    location /debug {
        access_log off;
        return 200 "Server is running!\nProject path: /home/master/LureGenix/frontend\n";
        add_header Content-Type text/plain;
    }
}