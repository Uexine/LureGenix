name: Deploy to VirtualBox

on:
  push:
    branches: [ dev, main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Install SSH key
      uses: shimataro/ssh-key-action@v2
      with:
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        known_hosts: ${{ secrets.SERVER_IP }}
        
    - name: Add known hosts
      run: |
        mkdir -p ~/.ssh
        ssh-keyscan -H ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts
    
    - name: Copy project to server
      run: |
        # Создаем папку проекта на сервере
        ssh ${{ secrets.SERVER_USERNAME }}@${{ secrets.SERVER_IP }} "mkdir -p ~/LureGenix"
        
        # Копируем весь проект (кроме .git)
        rsync -avz --delete --exclude '.git' ./ ${{ secrets.SERVER_USERNAME }}@${{ secrets.SERVER_IP }}:~/LureGenix/
    
    - name: Deploy with Docker
      run: |
        ssh ${{ secrets.SERVER_USERNAME }}@${{ secrets.SERVER_IP }} "
          cd ~/LureGenix
          
          # Останавливаем старый контейнер если есть
          docker-compose down || true
          
          # Запускаем новый
          docker-compose up -d --build
          
          # Проверяем статус
          docker-compose ps
        "
    
    - name: Health check
      run: |
        sleep 5
        ssh ${{ secrets.SERVER_USERNAME }}@${{ secrets.SERVER_IP }} "
          curl -f http://localhost:8080/health || echo 'Health check failed'
        "