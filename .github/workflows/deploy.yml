name: Deploy to VirtualBox

on:
  push:
    branches: [ dev, main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Install sshpass
      run: sudo apt-get update && sudo apt-get install -y sshpass
    
    - name: Create project directory on server
      run: |
        sshpass -p '${{ secrets.SERVER_PASSWORD }}' ssh -o StrictHostKeyChecking=no ${{ secrets.SERVER_USERNAME }}@${{ secrets.SERVER_IP }} "mkdir -p ~/LureGenix"
    
    - name: Copy project files
      run: |
        sshpass -p '${{ secrets.SERVER_PASSWORD }}' scp -r -o StrictHostKeyChecking=no \
          .github \
          frontend \
          nginx \
          docker-compose.yml \
          ${{ secrets.SERVER_USERNAME }}@${{ secrets.SERVER_IP }}:~/LureGenix/
    
    - name: Deploy with Docker
      run: |
        sshpass -p '${{ secrets.SERVER_PASSWORD }}' ssh -o StrictHostKeyChecking=no ${{ secrets.SERVER_USERNAME }}@${{ secrets.SERVER_IP }} "
          cd ~/LureGenix
          echo '🐳 Запускаем Docker...'
          
          # Останавливаем старые контейнеры
          docker-compose down 2>/dev/null || true
          
          # Запускаем новые
          docker-compose up -d --build
          
          # Проверяем статус
          echo '📊 Статус контейнеров:'
          docker-compose ps
          
          # Проверяем что сайт отвечает
          echo '🌐 Проверка сайта:'
          sleep 3
          curl -f http://localhost:8080/health || echo '⚠️ Сайт пока не отвечает'
        "
    
    - name: Show access info
      run: |
        echo "✅ Деплой завершен!"
        echo "🌐 Сайт доступен по адресу: http://${{ secrets.SERVER_IP }}:8080"