name: Deploy to VirtualBox

on:
  push:
    branches: [ dev, main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Setup SSH
      uses: webfactory/ssh-agent@v0.7.0
      with:
        ssh-private-key: ${{ secrets.SERVER_SSH_PRIVATE_KEY }}
    
    - name: Disable host key checking
      run: |
        mkdir -p ~/.ssh
        echo -e "Host *\n\tStrictHostKeyChecking no\n\tUserKnownHostsFile /dev/null" > ~/.ssh/config
    
    - name: Deploy via bore tunnel
      run: |
        ssh -p 2223 ${{ secrets.SERVER_USERNAME }}@bore.pub "
          cd ~/LureGenix
          
          # Создаем директорию если нет
          mkdir -p ~/LureGenix
          cd ~/LureGenix
          
          # Клонируем если репозитория нет
          if [ ! -d .git ]; then
            git clone https://github.com/${{ github.repository }}.git .
          fi
          
          # Обновляем код
          git fetch origin
          git reset --hard origin/${{ github.ref_name }}
          
          # Деплой
          docker-compose down --remove-orphans 2>/dev/null || true
          docker-compose up -d --build
          
          # Проверка
          echo '✅ Деплой готов!'
          echo '🌐 Сайт доступен локально: http://10.124.21.50:8080'
        "
    
    - name: Show deployment info
      run: |
        echo "✅ Деплой завершен!"
        echo "📝 Ветка: ${{ github.ref_name }}"
        echo "🔄 Коммит: ${{ github.sha }}"